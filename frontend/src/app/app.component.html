<div class="min-h-screen relative flex flex-col font-sans text-slate-900 overflow-x-hidden selection:bg-indigo-100 selection:text-indigo-900">
  
  <!-- Executive Background Layer -->
  <div class="fixed inset-0 -z-10 bg-[#f8fafc] overflow-hidden">
    <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-blue-100/40 rounded-full blur-[120px] animate-pulse"></div>
    <div class="absolute bottom-[10%] right-[-5%] w-[35%] h-[35%] bg-indigo-100/30 rounded-full blur-[100px]"></div>
    <div class="absolute top-[20%] right-[10%] w-[25%] h-[25%] bg-slate-200/20 rounded-full blur-[80px]"></div>
    <div class="absolute inset-0 bg-[linear-gradient(to_right,#80808012_1px,transparent_1px),linear-gradient(to_bottom,#80808012_1px,transparent_1px)] bg-[size:40px_40px] [mask-image:radial-gradient(ellipse_60%_50%_at_50%_0%,#000_70%,transparent_100%)]"></div>
    <div class="absolute inset-0 opacity-[0.015] pointer-events-none bg-[url('https://www.transparenttextures.com/patterns/stardust.png')]"></div>
  </div>

  <!-- FIXED Professional Business Header -->
  <header class="fixed top-0 left-0 right-0 h-16 bg-white/90 backdrop-blur-xl border-b border-slate-200/50 shadow-[0_4px_12px_rgba(0,0,0,0.03)] z-[100]">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-full">
      <div class="flex justify-between items-center h-full">
        <div class="flex items-center space-x-12">
          <!-- Logo Section -->
          <div class="flex items-center cursor-pointer group" routerLink="/">
            <div class="bg-slate-900 p-2 rounded-xl mr-3.5 transition-all group-hover:bg-indigo-600 shadow-sm group-hover:shadow-indigo-200">
              <svg class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
              </svg>
            </div>
            <div class="flex flex-col leading-none">
              <span class="text-lg font-black tracking-tight text-slate-900 uppercase">Sales<span class="text-indigo-600">Pro</span></span>
              <span class="text-[9px] font-bold text-slate-400 uppercase tracking-[0.3em] mt-0.5">Enterprise</span>
            </div>
          </div>
          
          <!-- Desktop Navigation -->
          <nav class="hidden md:flex items-center space-x-1">
            <a routerLink="/invoices" routerLinkActive="text-indigo-600 bg-indigo-50/50" [routerLinkActiveOptions]="{exact: true}" 
               class="px-4 py-2 rounded-lg text-xs font-bold uppercase tracking-widest text-slate-500 hover:text-slate-900 hover:bg-slate-100/50 transition-all duration-200">
              Invoices
            </a>
            <a routerLink="/report" routerLinkActive="text-indigo-600 bg-indigo-50/50" 
               class="px-4 py-2 rounded-lg text-xs font-bold uppercase tracking-widest text-slate-500 hover:text-slate-900 hover:bg-slate-100/50 transition-all duration-200">
              Reports
            </a>
          </nav>
        </div>

        <div class="flex items-center">
          <button routerLink="/invoices/create" 
                  class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2.5 rounded-xl text-xs font-bold uppercase tracking-widest shadow-lg shadow-indigo-200/50 hover:shadow-indigo-300/50 transform hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200 flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            New Document
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content Area with offset for the fixed header -->
  <main class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-28 pb-12 relative">
    <div class="bg-white border border-slate-200/60 rounded-[2rem] shadow-[0_32px_64px_-12px_rgba(0,0,0,0.08)] p-8 sm:p-12 overflow-hidden relative min-h-[600px]">
      <div class="absolute top-0 right-0 w-32 h-32 bg-slate-50 rounded-bl-full -z-10 opacity-50"></div>
      <router-outlet></router-outlet>
    </div>
  </main>

  <footer class="bg-white/40 backdrop-blur-md border-t border-slate-200/40 py-10 mt-auto">
    <div class="max-w-7xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center text-slate-400 text-[10px] font-bold uppercase tracking-[0.25em]">
      <div class="flex items-center gap-6 mb-6 md:mb-0">
        <span class="hover:text-slate-600 transition-colors cursor-pointer border-b border-transparent hover:border-slate-300 pb-0.5">Help Center</span>
        <span class="hover:text-slate-600 transition-colors cursor-pointer border-b border-transparent hover:border-slate-300 pb-0.5">System Status</span>
        <span class="hover:text-slate-600 transition-colors cursor-pointer border-b border-transparent hover:border-slate-300 pb-0.5">Privacy Policy</span>
      </div>
      <div class="flex items-center gap-2">
        <div class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></div>
        <span>Network Encrypted &bull; &copy; 2026 Enterprise Solutions</span>
      </div>
    </div>
  </footer>
</div>
